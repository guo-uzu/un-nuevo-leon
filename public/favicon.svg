  <!-- Logo Shapes -->
  <g fill="none" stroke="#ff7b00" stroke-width="44" stroke-linecap="butt">

    <!-- Letter 'g' loop -->
    <circle cx="310" cy="210" r="60" />

    <!-- Letter 'g' stem and tail -->
    <path d="M 370 150 L 370 300 A 55 55 0 0 1 265 350" />

